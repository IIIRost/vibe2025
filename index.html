<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .delete-btn {
            background: none;
            border: none;
            color: red;
            font-size: 1.2em;
            cursor: pointer;
        }
        .item-text {
            cursor: pointer;
        }
        .item-text:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    async function loadItems() {
        try {
            const response = await fetch('/');
            const html = await response.text();
            document.body.innerHTML = html;
        } catch (error) {
            console.error('Error loading items:', error);
        }
    }

    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            try {
                const response = await fetch('/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newItemText }),
                });

                if (response.ok) {
                    newItemInput.value = '';
                    await loadItems();
                } else {
                    console.error('Failed to add item');
                }
            } catch (error) {
                console.error('Error adding item:', error);
            }
        }
    }

    async function removeItem(id) {
        if (confirm('Are you sure you want to delete this item?')) {
            try {
                const response = await fetch('/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: id }),
                });

                if (response.ok) {
                    await loadItems();
                } else {
                    console.error('Failed to delete item');
                }
            } catch (error) {
                console.error('Error deleting item:', error);
            }
        }
    }

    function startEditing(id) {
        const textSpan = document.getElementById(`text-${id}`);
        const editInput = document.getElementById(`edit-${id}`);
        
        textSpan.style.display = 'none';
        editInput.style.display = 'inline';
        editInput.focus();
    }

    async function finishEditing(id) {
        const textSpan = document.getElementById(`text-${id}`);
        const editInput = document.getElementById(`edit-${id}`);
        const newText = editInput.value.trim();

        if (newText && newText !== textSpan.textContent) {
            try {
                const response = await fetch('/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: id, text: newText }),
                });

                if (response.ok) {
                    await loadItems();
                } else {
                    console.error('Failed to update item');
                    textSpan.style.display = 'inline';
                    editInput.style.display = 'none';
                }
            } catch (error) {
                console.error('Error updating item:', error);
                textSpan.style.display = 'inline';
                editInput.style.display = 'none';
            }
        } else {
            textSpan.style.display = 'inline';
            editInput.style.display = 'none';
        }
    }

    function handleEditKeyPress(event, id) {
        if (event.key === 'Enter') {
            finishEditing(id);
        } else if (event.key === 'Escape') {
            const textSpan = document.getElementById(`text-${id}`);
            const editInput = document.getElementById(`edit-${id}`);
            
            textSpan.style.display = 'inline';
            editInput.style.display = 'none';
        }
    }
</script>

</body>
</html>
